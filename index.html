<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Scheda D&amp;D</title>
<meta name="description" content="Scheda personaggio D&D offline - PWA installabile">
<meta name="theme-color" content="#2a6f69">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Scheda D&D">
<style>

:root{--bg:#eef0f2;--cd:#fff;--ink:#1c2230;--mu:#667085;--ac:#2a6f69;--hp:#b3372f;--ln:#d5d9de;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151c;--cd:#1a202b;--ink:#e7eaf0;--mu:#8e98a9;--ac:#6cc4bb;--hp:#e0645c;--ln:#2b3343}}
:root[data-theme="dark"]{--bg:#11151c;--cd:#1a202b;--ink:#e7eaf0;--mu:#8e98a9;--ac:#6cc4bb;--hp:#e0645c;--ln:#2b3343}
html,body{height:100%}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,sans-serif}
h1,h2,h3{font-family:Georgia,serif;margin:.2em 0}small,.mu{color:var(--mu)}
main{padding:10px 12px 96px;max-width:560px;margin:auto}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;max-width:560px;margin:auto}header div{display:flex;flex-direction:column}
.c{background:var(--cd);border:1px solid var(--ln);border-radius:10px;padding:10px;margin:8px 0}
.r{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.b,.chip,.tile{font:inherit;color:inherit;background:var(--cd);border:1px solid var(--ln);border-radius:8px;padding:8px 12px;cursor:pointer}
.b{background:var(--ac);color:#fff;border-color:var(--ac)}.b.d{background:var(--hp);border-color:var(--hp)}.b.o{background:none;color:var(--ink);border-color:var(--ln)}
.tile{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px}.tile b{font-size:1.4em}
.hp{grid-column:span 2;background:var(--hp);color:#fff;border:0;border-radius:10px;font:700 1.6em Georgia,serif;padding:12px;cursor:pointer}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--cd);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--mu);font:inherit;font-size:.8em;padding:12px 0}nav .on{color:var(--ac);font-weight:700}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:8px;width:100%;box-sizing:border-box}
label{display:block;margin:8px 0;color:var(--mu);font-size:.9em}input[type=checkbox]{width:auto}
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 4px;border-bottom:1px solid var(--ln);cursor:pointer}
.hero{min-height:80vh;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:20px;max-width:420px;margin:auto}.big2{padding:22px;font-size:1.2em}
#tt{position:fixed;left:8px;right:8px;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:5}
.t{background:var(--ink);color:var(--bg);border-radius:12px;padding:12px;max-width:540px;margin:auto;text-align:center}.t small{color:inherit;opacity:.8}.t .big{font:700 2.6em Georgia,serif}
.ov{position:fixed;inset:0;background:#0008;z-index:9;display:flex;align-items:flex-end}.sh{background:var(--cd);width:100%;max-width:560px;margin:auto;border-radius:14px 14px 0 0;padding:14px;max-height:85%;overflow:auto;box-sizing:border-box}
.pip{display:inline-block;vertical-align:middle;margin:0 2px;width:22px;height:22px;border-radius:50%;border:2px solid var(--ac);background:none;padding:0}.pip.f{background:var(--ac)}
.tbl{overflow-x:auto}
.tn{display:flex;align-items:center;gap:10px;padding:8px 10px;margin:6px 0;border:1px solid var(--ln);border-left:5px solid var(--ln);border-radius:12px;background:var(--cd)}
.tn.pl{border-left-color:var(--ac)}.tn.mo{border-left-color:var(--hp)}
.tn.cur{background:var(--bg);border-color:var(--ac);box-shadow:0 0 0 2px var(--ac);background:color-mix(in srgb,var(--ac) 14%,var(--cd));box-shadow:0 0 0 2px color-mix(in srgb,var(--ac) 40%,transparent)}
.tn.cur.mo{border-color:var(--hp);box-shadow:0 0 0 2px var(--hp);background:color-mix(in srgb,var(--hp) 12%,var(--cd));box-shadow:0 0 0 2px color-mix(in srgb,var(--hp) 35%,transparent)}
.tn.dn{opacity:.5}.tn.me{outline:2px dashed var(--ac);outline-offset:2px}
.tn .ini{flex:none;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 .95em Georgia,serif;background:var(--bg);border:1px solid var(--ln)}
.tn.cur .ini{background:var(--ac);color:#fff;border-color:var(--ac)}.tn.cur.mo .ini{background:var(--hp);border-color:var(--hp)}
.tn .bd{flex:1;min-width:0}.tn .nm{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tn .tag{font-size:.68em;text-transform:uppercase;letter-spacing:.05em;padding:1px 7px;border-radius:99px;background:var(--ac);color:#fff;margin-left:6px;vertical-align:middle}.tn.mo .tag{background:var(--hp)}
.rn{font:700 1.15em Georgia,serif}.lvh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.stp{display:flex;gap:6px;overflow-x:auto;padding:6px 2px 2px;position:relative;-webkit-overflow-scrolling:touch}
.sc{flex:none;max-width:11em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:3px 10px;border-radius:99px;border:1px solid var(--ln);background:var(--bg);font-size:.85em}
.sc.pl{border-color:var(--ac)}.sc.mo{border-color:var(--hp)}
.sc.cur{background:var(--ac);color:#fff;font-weight:700}.sc.cur.mo{background:var(--hp)}
.sc.done{opacity:.5}.sc.dw{opacity:.7}.sc.dn{opacity:.4;text-decoration:line-through}.sc.me{outline:2px solid var(--ac);outline-offset:1px}
.tx{font-size:.9em;margin-top:2px}.tx.yt{background:var(--ac);color:#fff;border-radius:8px;padding:3px 8px;display:inline-block}

.hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:2px}
.it{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:9px 0;border-top:1px solid var(--ln)}.hd+.it{border-top:0}
.itb{flex:1;min-width:0;display:flex;flex-direction:column}.its{display:flex;flex-direction:column;align-items:flex-end}.ita{width:100%}
.sp{display:block;position:relative}.sp details{padding-right:86px}.sp>.b{position:absolute;right:0;top:8px;padding:6px 12px}
.sp summary,.zn summary{list-style:none;cursor:pointer}.sp summary::-webkit-details-marker,.zn summary::-webkit-details-marker{display:none}
.zn{flex-wrap:nowrap;align-items:flex-start}.zn details{flex:1;min-width:0}.zn details[open] summary b{color:var(--ac)}.znq{flex:none;gap:6px}.sp details[open] summary b{color:var(--ac)}
.tg{font-size:.72em;font-weight:700;letter-spacing:.12em;color:var(--ac)}
details.add{margin-top:8px;border-top:1px solid var(--ln);padding-top:8px}details.add summary{cursor:pointer;color:var(--ac);font-weight:600}
</style></head><body><div id="app"></div><div id="tt"></div><div id="mo"></div>

<script>window.APP_VER='14';</script>
<script src="app.js?v=14" defer></script>
<script>
(function(){
var v=window.APP_VER||'';
function chip(){try{var d=document.createElement('div');d.id='appver';d.textContent='Scheda D&D v'+v;d.style.cssText='position:fixed;right:10px;bottom:6px;font:11px system-ui,sans-serif;color:var(--mu,#667085);opacity:.75;pointer-events:none;z-index:9';document.body.appendChild(d)}catch(e){}}
if(document.readyState=='loading')addEventListener('DOMContentLoaded',chip);else chip();
var bn=document.createElement('div');bn.style.cssText='display:none;position:fixed;left:10px;right:10px;bottom:56px;z-index:99;background:#2a6f69;color:#fff;padding:10px 12px;border-radius:10px;font:14px system-ui,sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.3)';var bt=document.createElement('span');bt.textContent='Aggiornamento disponibile';bn.appendChild(bt);var b=document.createElement('button');b.textContent='Aggiorna ora';b.style.cssText='margin-left:10px;background:#fff;color:#2a6f69;border:0;border-radius:8px;padding:6px 12px;font-weight:600;cursor:pointer';bn.appendChild(b);document.body.appendChild(bn);
var nw=null,refreshing=false,hadCtrl=false;
function show(w){nw=w;bn.style.display='block'}
b.onclick=function(){if(nw)try{nw.postMessage('SKIP_WAITING')}catch(e){}bn.style.display='none'};
if('serviceWorker' in navigator){
 try{
  hadCtrl=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange',function(){if(!hadCtrl){hadCtrl=true;return}if(refreshing)return;refreshing=true;location.reload()});
  var reg=null;
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(function(r){reg=r;r.addEventListener('updatefound',function(){var w=r.installing;if(!w)return;w.addEventListener('statechange',function(){if(w.state==='installed'&&navigator.serviceWorker.controller)show(w)})})}).catch(function(){});
  var upd=function(){if(reg)try{reg.update()}catch(e){}};
  addEventListener('load',upd);
  addEventListener('focus',upd);
  document.addEventListener('visibilitychange',function(){if(document.visibilityState=='visible')upd()});
 }catch(e){}
}
})();
</script>
</body></html>
